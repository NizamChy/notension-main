name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test build
      # Demo-mode smoke tests against the production build. The runner
      # already has Google Chrome, which the Playwright config uses.
      - run: npm run e2e
        env:
          CI: "true"
